[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meyaya"
version = "0.1.0"
description = "A polished Discord social interaction bot."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    # ``audioop`` is bundled through Python 3.12; the maintained replacement
    # is only needed (and only published) for Python 3.13 and newer.
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "alembic>=1.13",
    # Discord voice now requires DAVE end-to-end encryption.  discord.py 2.7
    # provides the DAVE session; the receiver fork decrypts inbound frames with it.
    "discord.py[voice]>=2.7.1",
    "davey>=0.1.6",
    # Upstream's published receiver cannot yet decrypt Discord's required DAVE
    # frames. This maintained fork includes the DAVE receive and router fixes.
    "discord-ext-voice-recv @ git+https://github.com/rdphillips7/discord-ext-voice-recv.git@ddd2860",
    "google-genai>=1.34.0",
    "langdetect>=1.0.9",
    "pillow>=13.0.0",
    "PyNaCl>=1.5",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "tzdata>=2024.1",
    "asyncpg>=0.29",
    # Alembic uses a synchronous engine after translating the async application URL.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dashboard = ["boto3>=1.35"]
dev = [
    "bandit[toml]>=1.8",
    "black>=26.10.1",
    "mypy>=1.11",
    "pip-audit>=2.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["bot*"]
exclude = ["bot.private", "bot.private.*"]

[tool.setuptools.package-data]
"bot.web" = ["*.html", "*.css", "*.js"]
"bot.data" = ["*.json", "cards/*.json"]
"bot" = ["assets/profile/badges/*.png", "assets/profile/duostyle/*.png", "assets/profile/callingcard/*.png", "assets/profile/badges/*.md", "assets/celestial/**/*.png", "assets/celestial/**/*.jpg", "assets/celestial/**/*.txt", "assets/celestial/**/*.ttf", "assets/celestial/*.md", "assets/disco/*.jpg", "assets/disco/*.png", "assets/solosamba/*.json", "assets/duels/*.png", "assets/duels/*.gif", "assets/duels/*.jpg", "assets/duels/*.json", "assets/duels/*.md", "assets/awakening/**/*.png", "assets/fantasy/dungeon/**/*.jpg", "assets/fantasy/dungeon/*.json", "assets/fantasy/dungeon/*.md", "private/personality.v1.json", "private/gemini_persona.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv-win", "artifacts", "archive", "feature_archive", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F", "B", "ASYNC", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv-win"
typeCheckingMode = "standard"
include = ["bot", "alembic", "start.py", "dashboard.py"]
exclude = [
    "**/.venv*",
    "**/__pycache__",
    "artifacts",
    "archive",
    "feature_archive",
    "build",
    "dist",
    "node_modules",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["manual", ".git", ".venv*", "node_modules"]

[tool.coverage.run]
branch = true
source = ["bot"]
omit = ["bot/private/*", "tests/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.bandit]
targets = ["bot", "start.py", "dashboard.py"]
exclude_dirs = ["tests", "artifacts", "archive", "feature_archive", ".venv", ".venv-win", "build", "dist"]
