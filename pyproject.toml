[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meyaya"
version = "0.1.0"
description = "A polished Discord social interaction bot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    # ``audioop`` is bundled through Python 3.12; the maintained replacement
    # is only needed (and only published) for Python 3.13 and newer.
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "alembic>=1.13",
    # Discord voice now requires DAVE end-to-end encryption.  discord.py 2.7
    # provides the DAVE session; the receiver fork decrypts inbound frames with it.
    "discord.py[voice]>=2.7.1",
    "davey>=0.1.6",
    # Upstream's published receiver cannot yet decrypt Discord's required DAVE
    # frames. This maintained fork includes the DAVE receive and router fixes.
    "discord-ext-voice-recv @ git+https://github.com/rdphillips7/discord-ext-voice-recv.git@ddd2860",
    "google-genai>=1.34.0",
    "langdetect>=1.0.9",
    "pillow>=10.4",
    "PyNaCl>=1.5",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "tzdata>=2024.1",
    "asyncpg>=0.29",
    # Alembic uses a synchronous engine after translating the async application URL.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["bot*"]
exclude = ["bot.private", "bot.private.*"]

[tool.setuptools.package-data]
"bot.web" = ["*.html", "*.css", "*.js"]
"bot.data" = ["*.json", "cards/*.json"]
"bot" = ["assets/celestial/**/*.png", "assets/celestial/**/*.jpg", "assets/celestial/**/*.txt", "assets/celestial/*.md", "private/personality.v1.json", "private/gemini_persona.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "test_reddit_command.py", "test_duck_command.py", "test_chat_command_reply.py", "test_chat_batching.py", "test_conversation_identity.py", "test_chat_quiet.py", "test_command_loading.py"]
