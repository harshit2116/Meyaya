name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      DISCORD_TOKEN: ci-placeholder-not-a-real-token
      DATABASE_URL: postgresql+asyncpg://postgres:ci-password@127.0.0.1:5432/meyaya_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      GEMINI_API_KEY: ""
      KLIPY_API_KEY: ""
      DASHBOARD_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: meyaya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meyaya_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build ruff
      - name: Check syntax and critical errors
        run: |
          python -m compileall -q bot alembic start.py dashboard.py
          python -m ruff check --select E9,F821,F822,F823 bot alembic start.py dashboard.py
      - name: Build and install package
        run: |
          python -m build --wheel
          python -m pip install --disable-pip-version-check dist/*.whl
          python -m pip check
      - name: Validate startup configuration
        run: python start.py --check
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Check imports, schema, cache, and Components V2
        run: |
          python - <<'PY'
          import asyncio
          import importlib
          import pkgutil

          import discord
          import redis.asyncio as redis
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy.orm import configure_mappers

          import bot.cogs
          import bot.models
          from bot.config.settings import get_settings
          from bot.utils.components_v2 import MeyayaView

          for package in (bot.cogs, bot.models):
              for module in pkgutil.iter_modules(package.__path__, package.__name__ + "."):
                  importlib.import_module(module.name)
          configure_mappers()
          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          assert len(heads) == 1, "Migration history must have exactly one head"

          async def check():
              settings = get_settings()
              engine = create_async_engine(settings.database_url)
              cache = redis.from_url(settings.redis_url, decode_responses=True)
              view = None
              try:
                  async with engine.connect() as connection:
                      revision = await connection.scalar(text("SELECT version_num FROM alembic_version"))
                      assert revision == heads[0], "Database schema is not current"
                  await cache.set("ci:health", "ok", ex=30)
                  assert await cache.get("ci:health") == "ok"
                  await cache.delete("ci:health")
                  view = MeyayaView().present(embeds=[discord.Embed(title="CI", description="Ready")])
                  view.add_item(discord.ui.Button(label="Action", custom_id="ci:action"))
                  payload = view.to_components()
                  assert payload[0]["type"] == 17
                  assert payload[1]["components"][0]["custom_id"] == "ci:action"
              finally:
                  if view is not None:
                      view.stop()
                  await cache.aclose()
                  await engine.dispose()

          asyncio.run(check())
          print("All checks passed")
          PY
